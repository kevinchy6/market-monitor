name: Data staleness alarm

# A dead-man's switch for both sites. The watchdog that normally keeps them
# fresh runs inside the maintainer's local assistant session, so if that session
# stops (app closed, machine asleep) nothing notices. This job is independent of
# it: it looks at the committed data itself and opens an issue when a market has
# stopped being refreshed.
#
# Caveat: this is scheduled by GitHub too, so it inherits the same cron
# unreliability it is meant to catch. It is deliberately cheap and coarse --
# it catches "the pipeline has been dead for hours", not "one run was late".

on:
  schedule:
    - cron: '0 */4 * * *'   # every 4 hours
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: staleness-alarm
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Measure data age
        id: measure
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import datetime, json, urllib.request

          RAW = "https://raw.githubusercontent.com/kevinchy6/{repo}/main/{path}?x={ts}"
          now = datetime.datetime.now(datetime.timezone.utc)
          ts = int(now.timestamp())

          def age_hours(repo, path):
              url = RAW.format(repo=repo, path=path, ts=ts)
              req = urllib.request.Request(url, headers={"User-Agent": "staleness-check"})
              with urllib.request.urlopen(req, timeout=20) as r:
                  doc = json.load(r)
              stamp = doc.get("lastUpdated") or (doc.get("_meta") or {}).get("updated")
              if not stamp:
                  return None
              t = datetime.datetime.strptime(stamp, "%Y-%m-%dT%H:%M:%SZ").replace(
                  tzinfo=datetime.timezone.utc)
              return (now - t).total_seconds() / 3600

          problems, notes = [], []
          in_us_session = now.weekday() < 5 and 13 <= now.hour < 21

          def check(label, repo, path, limit, active):
              try:
                  age = age_hours(repo, path)
              except Exception as e:  # noqa: BLE001
                  problems.append(f"{label} 读取失败：{str(e)[:120]}")
                  return
              if age is None:
                  problems.append(f"{label} 没有时间戳")
                  return
              notes.append(f"{label} {age:.1f}h")
              if active and age > limit:
                  problems.append(f"{label} 已 {age:.1f} 小时未更新（阈值 {limit}h）")

          # US data is only expected to move during the US session; outside it
          # (nights, weekends) it is legitimately frozen, so no alarm.
          check("美股", "equity-screener", "public/data/us.json",
                  limit=4, active=in_us_session)
          # HK/JP legitimately sit still for a weekend; 48h means a missed
          # trading day or a dead pipeline.
          check("港股", "equity-screener", "public/data/hk.json", limit=48, active=True)
          check("日股", "equity-screener", "public/data/jp.json", limit=48, active=True)
          check("行情仪表盘", "market-monitor", "data.json", limit=8, active=True)

          detail = "；".join(notes) if notes else "无数据"
          if problems:
              print("stale=yes")
              print(f"detail={'；'.join(problems)}")
          else:
              print("stale=no")
              print(f"detail={detail}")
          PY

      - name: Raise or clear the alarm
        env:
          GH_TOKEN: ${{ github.token }}
          # No checkout in this job, so gh cannot infer the repo from git.
          GH_REPO: ${{ github.repository }}
          STALE: ${{ steps.measure.outputs.stale }}
          DETAIL: ${{ steps.measure.outputs.detail }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create staleness --description "数据陈旧自动告警" --color B60205 >/dev/null 2>&1 || true
          existing=$(gh issue list --label staleness --state open --limit 1 \
                     --json number --jq '.[0].number // empty')
          if [ "$STALE" = "yes" ]; then
            body="检测时间（UTC）：$(date -u +'%Y-%m-%d %H:%M')
          
          $DETAIL
          
          运行记录：$RUN_URL"
            if [ -n "$existing" ]; then
              echo "已在 #$existing 下补充记录"
              gh issue comment "$existing" --body "$body"
            else
              echo "创建新 issue"
              gh issue create --label staleness \
                --title "数据陈旧：$DETAIL" \
                --body "$body"
            fi
          else
            if [ -n "$existing" ]; then
              echo "已恢复，关闭 #$existing"
              gh issue comment "$existing" --body "已恢复正常（$(date -u +'%Y-%m-%d %H:%M') UTC）：$DETAIL"
              gh issue close "$existing"
            else
              echo "一切正常：$DETAIL"
            fi
          fi
